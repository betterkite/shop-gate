[project]
name = "shopgate-commerce-data"
version = "0.1.0"
description = "Shop Gate 零售行为、商品与经营数据后端"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.124.0",
    "psycopg[binary]>=3.3.2",
    "python-dotenv>=1.2.1",
    "redis>=8.0.0",
    "uvicorn[standard]>=0.48.0",
]

[project.scripts]
shopgate-commerce-api = "shopgate_commerce_data.cli:main"
shopgate-commerce-import = "shopgate_commerce_data.import_cli:main"

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "respx>=0.22.0",
    "ruff>=0.14.0",
]

[build-system]
requires = ["hatchling>=1.29.0"]
build-backend = "hatchling.build"

[tool.uv]
python-preference = "managed"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
